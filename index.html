<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visa Application Document Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 p-4 md:p-8 max-w-5xl mx-auto font-sans">
  
  <!-- Login Section -->
  <div id="auth-section" class="max-w-md mx-auto my-12 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
    <h2 class="text-xl font-bold mb-4">UDI Document Tracker Login</h2>
    <input id="email" type="email" placeholder="Enter your email" class="w-full border p-2 rounded mb-3 outline-none focus:ring-2 focus:ring-blue-500" />
    <button onclick="sendMagicLink()" class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700 transition-colors">Send Magic Link</button>
  </div>

  <!-- Main App Section -->
  <div id="app-section" class="hidden">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b pb-4">
      <div>
        <h1 class="text-2xl font-bold">Family Immigration Tracker</h1>
        <p class="text-sm text-slate-500 mt-1">UDI Section 46 Checklist & Logistics</p>
      </div>
      <div class="mt-4 md:mt-0 flex items-center gap-4">
        <span id="user-email-display" class="text-sm font-medium bg-slate-200 px-3 py-1 rounded-full text-slate-700"></span>
        <button onclick="logout()" class="text-sm text-red-600 hover:underline font-medium">Log out</button>
      </div>
    </header>

    <!-- Add New Document/Task -->
    <div class="mb-8 p-5 bg-white rounded-xl shadow-sm border border-slate-200">
      <h3 class="font-bold text-slate-800 mb-3">Add Document or Task</h3>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
        <input id="new-title" type="text" placeholder="Task/Document Name *" class="border border-slate-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
        <select id="new-category" class="border border-slate-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
          <option value="Nepal">🇳🇵 Nepal</option>
          <option value="Norway">🇳🇴 Norway</option>
          <option value="Guarantor">🇳🇴 Guarantor</option>
          <option value="Logistics">📅 Logistics & Tasks</option>
          <option value="Abroad">🌍 Abroad</option>
        </select>
        <input id="new-assignee" type="text" placeholder="Assignee *" class="border border-slate-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      
      <!-- Optional Contact Fields -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <input id="new-phone" type="text" placeholder="Telephone (Optional)" class="border border-slate-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        <input id="new-email" type="email" placeholder="Email (Optional)" class="border border-slate-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        <input id="new-address" type="text" placeholder="Address (Optional)" class="border border-slate-300 p-2 rounded-lg text-sm md:col-span-2 focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>

      <button onclick="addDocument()" class="mt-4 bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors w-full md:w-auto">Add to Tracker</button>
    </div>

    <!-- Task List Container -->
    <div class="grid gap-4" id="task-list">
      <!-- Injected dynamically via JS -->
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://urboammtxxgakvhbxydz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Qf3lwv88KRlHuHw4B_9dQw_aaJiZpue";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('user-email-display').innerText = session.user.email;
        loadTasks();
      }
    }

    async function sendMagicLink() {
      const email = document.getElementById('email').value;
      const { error } = await supabase.auth.signInWithOtp({ email });
      if (error) alert(error.message);
      else alert('Check your email for the login link!');
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    async function loadTasks() {
      const { data: tasks, error } = await supabase
        .from('document_tasks')
        .select('*')
        .order('category', { ascending: true });

      if (error) return console.error(error);

      const container = document.getElementById('task-list');
      container.innerHTML = tasks.map(task => {
        let badgeColor = 'bg-slate-100 text-slate-800';
        if (task.category === 'Nepal') badgeColor = 'bg-orange-100 text-orange-800';
        else if (task.category === 'Norway') badgeColor = 'bg-indigo-100 text-indigo-800';
        else if (task.category === 'Guarantor') badgeColor = 'bg-blue-100 text-blue-800';
        else if (task.category === 'Logistics') badgeColor = 'bg-green-100 text-green-800';

        let contactHtml = '';
        if (task.telephone) contactHtml += `<span class="mr-3">📞 ${task.telephone}</span>`;
        if (task.email) contactHtml += `<span class="mr-3">✉️ <a href="mailto:${task.email}" class="text-blue-600 hover:underline">${task.email}</a></span>`;
        if (task.address) contactHtml += `<span>📍 ${task.address}</span>`;
        
        let extraDetails = contactHtml ? `<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-100">${contactHtml}</div>` : '';

        return `
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-start justify-between gap-4 hover:border-blue-300 transition-colors">
          <div class="flex-1">
            <div class="flex items-center gap-3 mb-1">
              <span class="text-xs px-2.5 py-1 rounded-md font-semibold ${badgeColor} tracking-wide uppercase">${task.category}</span>
              <h3 class="font-bold text-slate-800">${task.title}</h3>
            </div>
            <p class="text-sm text-slate-500 mt-1">
              <span class="font-semibold text-slate-700">Assignee: ${task.assignee}</span> ${task.notes ? '• ' + task.notes : ''}
            </p>
            ${extraDetails}
          </div>
          <select onchange="updateStatus('${task.id}', this.value)" class="border border-slate-300 rounded-lg px-4 py-2 text-sm bg-slate-50 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
            ${['Pending', 'In Progress', 'Translated', 'Legalized (MOFA)', 'Completed'].map(st => `
              <option value="${st}" ${task.status === st ? 'selected' : ''}>${st}</option>
            `).join('')}
          </select>
        </div>
      `}).join('');
    }

    async function updateStatus(id, newStatus) {
      const { error } = await supabase.from('document_tasks').update({ status: newStatus }).eq('id', id);
      if (error) alert("Error updating: " + error.message);
    }

    async function addDocument() {
      const title = document.getElementById('new-title').value;
      const category = document.getElementById('new-category').value;
      const assignee = document.getElementById('new-assignee').value;
      const phone = document.getElementById('new-phone').value;
      const email = document.getElementById('new-email').value;
      const address = document.getElementById('new-address').value;

      if (!title || !assignee) return alert("Please fill out the document name and assignee.");

      const { error } = await supabase.from('document_tasks').insert({ 
        title: title, 
        category: category, 
        assignee: assignee, 
        telephone: phone || null,
        email: email || null,
        address: address || null,
        status: 'Pending' 
      });

      if (error) {
        alert("Failed to add: " + error.message);
      } else {
        document.getElementById('new-title').value = '';
        document.getElementById('new-assignee').value = '';
        document.getElementById('new-phone').value = '';
        document.getElementById('new-email').value = '';
        document.getElementById('new-address').value = '';
        loadTasks(); 
      }
    }

    checkAuth();
  </script>
</body>
</html>
