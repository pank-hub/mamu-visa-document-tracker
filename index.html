<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mamu ko visa application tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 p-4 md:p-8 max-w-5xl mx-auto font-sans relative">
  
  <!-- Login Section -->
  <div id="auth-section" class="max-w-md mx-auto my-12 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
    <h2 class="text-xl font-bold mb-4">UDI Document Tracker Login</h2>
    <input id="email" type="email" placeholder="Enter your email" class="w-full border p-2 rounded mb-3 outline-none focus:ring-2 focus:ring-blue-500" />
    <button onclick="sendMagicLink()" class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700 transition-colors">Send Magic Link</button>
  </div>

  <!-- Main App Section -->
  <div id="app-section" class="hidden">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b pb-4">
      <div>
        <h1 class="text-2xl font-bold">Family Immigration Tracker</h1>
        <p class="text-sm text-slate-500 mt-1">UDI Section 46 Checklist & Logistics</p>
      </div>
      <div class="mt-4 md:mt-0 flex items-center gap-4">
        <span id="user-email-display" class="text-sm font-medium bg-slate-200 px-3 py-1 rounded-full text-slate-700"></span>
        <button onclick="logout()" class="text-sm text-red-600 hover:underline font-medium">Log out</button>
      </div>
    </header>

    <!-- Smart Summary Dashboard -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Tasks</p>
        <h3 id="stat-total" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs font-semibold text-green-600 uppercase tracking-wider">Completed</p>
        <h3 id="stat-completed" class="text-2xl font-bold text-green-700 mt-1">0</h3>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs font-semibold text-amber-600 uppercase tracking-wider">In Progress / Pending</p>
        <h3 id="stat-pending" class="text-2xl font-bold text-amber-700 mt-1">0</h3>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs font-semibold text-blue-600 uppercase tracking-wider">Locked Admin</p>
        <h3 id="stat-locked" class="text-2xl font-bold text-blue-700 mt-1">0</h3>
      </div>
    </div>

    <!-- Add New Document/Task (HIDDEN BY DEFAULT) -->
    <div id="add-task-section" class="hidden mb-8 p-5 bg-white rounded-xl shadow-sm border border-slate-200">
      <h3 class="font-bold text-slate-800 mb-3">Add Document or Task</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
        <input id="new-title" type="text" placeholder="Task/Document Name *" class="border border-slate-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
        <select id="new-category" class="border border-slate-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
          <option value="Nepal">🇳🇵 Nepal</option>
          <option value="Norway">🇳🇴 Norway</option>
          <option value="Guarantor">🇳🇴 Guarantor</option>
          <option value="Logistics">📅 Logistics & Tasks</option>
          <option value="Abroad">🌍 Abroad</option>
        </select>
        <input id="new-assignee" type="text" placeholder="Assignee *" class="border border-slate-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
        <input id="new-phone" type="text" placeholder="Telephone (Optional)" class="border border-slate-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        <input id="new-email" type="email" placeholder="Email (Optional)" class="border border-slate-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        <input id="new-address" type="text" placeholder="Address (Optional)" class="border border-slate-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>
      <div class="mb-3">
        <input id="new-notes" type="text" placeholder="Comments / Notes (e.g. Needs translation)" class="w-full border border-slate-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>
      <button onclick="addDocument()" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors w-full md:w-auto">Add to Tracker</button>
    </div>

    <!-- Task List Container -->
    <div class="grid gap-4" id="task-list">
      <!-- Injected dynamically via JS -->
    </div>
  </div>

  <!-- Edit Task Modal (Popup) -->
  <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-lg p-6 max-w-lg w-full">
      <h3 class="font-bold text-lg text-slate-800 mb-4">Edit Task</h3>
      <input type="hidden" id="edit-id" />
      <div class="space-y-3">
        <input id="edit-title" type="text" placeholder="Task Name" class="w-full border border-slate-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
        <div class="grid grid-cols-2 gap-3">
          <select id="edit-category" class="w-full border border-slate-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            <option value="Nepal">🇳🇵 Nepal</option>
            <option value="Norway">🇳🇴 Norway</option>
            <option value="Guarantor">🇳🇴 Guarantor</option>
            <option value="Logistics">📅 Logistics & Tasks</option>
            <option value="Abroad">🌍 Abroad</option>
          </select>
          <input id="edit-assignee" type="text" placeholder="Assignee" class="w-full border border-slate-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <input id="edit-phone" type="text" placeholder="Telephone" class="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" />
          <input id="edit-email" type="email" placeholder="Email" class="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <input id="edit-address" type="text" placeholder="Address" class="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" />
        <input id="edit-notes" type="text" placeholder="Comments / Notes" class="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="flex justify-end gap-3 mt-6">
        <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-300">Cancel</button>
        <button onclick="saveEdit()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://urboammtxxgakvhbxydz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Qf3lwv88KRlHuHw4B_9dQw_aaJiZpue";
    
    const ADMIN_EMAILS = ['kafley@gmail.com']; 
    
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let allTasks = []; 
    let isAdmin = false;

    async function checkAuth() {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('user-email-display').innerText = session.user.email;
        
        isAdmin = ADMIN_EMAILS.includes(session.user.email);
        if (isAdmin) {
          document.getElementById('add-task-section').classList.remove('hidden');
        }

        loadTasks();
      }
    }

    async function sendMagicLink() {
      const email = document.getElementById('email').value;
      const { error } = await db.auth.signInWithOtp({ 
        email: email,
        options: { emailRedirectTo: 'https://pank-hub.github.io/mamu-visa-document-tracker/' }
      });
      if (error) alert(error.message);
      else alert('Check your email for the login link!');
    }

    async function logout() {
      await db.auth.signOut();
      location.reload();
    }

    async function loadTasks() {
      const { data: tasks, error } = await db
        .from('document_tasks')
        .select('*')
        .order('sort_order', { ascending: true });

      if (error) return console.error(error);
      allTasks = tasks; 

      // Update Dashboard Counters
      const total = tasks.length;
      const completed = tasks.filter(t => t.status === 'Completed').length;
      const locked = tasks.filter(t => t.is_locked).length;
      const pending = total - completed;

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-completed').innerText = completed;
      document.getElementById('stat-pending').innerText = pending;
      document.getElementById('stat-locked').innerText = locked;

      const container = document.getElementById('task-list');
      container.innerHTML = tasks.map((task, index) => {
        let badgeColor = 'bg-slate-100 text-slate-800';
        if (task.category === 'Nepal') badgeColor = 'bg-orange-100 text-orange-800';
        else if (task.category === 'Norway') badgeColor = 'bg-indigo-100 text-indigo-800';
        else if (task.category === 'Guarantor') badgeColor = 'bg-blue-100 text-blue-800';
        else if (task.category === 'Logistics') badgeColor = 'bg-green-100 text-green-800';

        let contactHtml = '';
        if (task.telephone) contactHtml += `<span class="mr-3">📞 ${task.telephone}</span>`;
        if (task.email) contactHtml += `<span class="mr-3">✉️ <a href="mailto:${task.email}" class="text-blue-600 hover:underline">${task.email}</a></span>`;
        if (task.address) contactHtml += `<span>📍 ${task.address}</span>`;
        let extraDetails = contactHtml ? `<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-100">${contactHtml}</div>` : '';

        let adminControls = isAdmin ? `
          <div class="mt-3 flex items-center gap-4 border-t border-slate-100 pt-3 flex-wrap">
            <button onclick="moveTask('${task.id}', 'up')" class="text-xs font-medium text-slate-600 hover:underline">⬆️ Up</button>
            <button onclick="moveTask('${task.id}', 'down')" class="text-xs font-medium text-slate-600 hover:underline">⬇️ Down</button>
            <button onclick="toggleLock('${task.id}', ${task.is_locked})" class="text-xs font-medium ${task.is_locked ? 'text-amber-600' : 'text-slate-600'} hover:underline">
              ${task.is_locked ? '🔓 Unlock' : '🔒 Lock'}
            </button>
            <button onclick="openEditModal('${task.id}')" class="text-xs font-medium text-blue-600 hover:underline disabled:opacity-30 disabled:cursor-not-allowed" ${task.is_locked ? 'disabled' : ''}>Edit</button>
            <button onclick="deleteTask('${task.id}')" class="text-xs font-medium text-red-600 hover:underline disabled:opacity-30 disabled:cursor-not-allowed" ${task.is_locked ? 'disabled' : ''}>Delete</button>
          </div>
        ` : '';

        return `
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-start justify-between gap-4 hover:border-blue-300 transition-colors ${task.is_locked ? 'bg-slate-50/50' : ''}">
          <div class="flex-1">
            <div class="flex items-center gap-3 mb-1">
              <span class="text-xs px-2.5 py-1 rounded-md font-semibold ${badgeColor} tracking-wide uppercase">${task.category}</span>
              <h3 class="font-bold text-slate-800">${task.title} ${task.is_locked ? '🔒' : ''}</h3>
            </div>
            <p class="text-sm text-slate-500 mt-1">
              <span class="font-semibold text-slate-700">Assignee: ${task.assignee}</span> ${task.notes ? '• ' + task.notes : ''}
            </p>
            ${extraDetails}
            ${adminControls}
          </div>
          <select onchange="updateStatus('${task.id}', this.value)" class="border border-slate-300 rounded-lg px-4 py-2 text-sm bg-slate-50 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed" ${task.is_locked ? 'disabled' : ''}>
            ${['Pending', 'In Progress', 'Translated', 'Legalized (MOFA)', 'Completed'].map(st => `
              <option value="${st}" ${task.status === st ? 'selected' : ''}>${st}</option>
            `).join('')}
          </select>
        </div>
      `}).join('');
    }

    async function moveTask(id, direction) {
      const currentIndex = allTasks.findIndex(t => t.id === id);
      if (currentIndex === -1) return;
      
      const targetIndex = direction === 'up' ? currentIndex - 1 : currentIndex + 1;
      if (targetIndex < 0 || targetIndex >= allTasks.length) return; 

      // Swap in local array
      const temp = allTasks[currentIndex];
      allTasks[currentIndex] = allTasks[targetIndex];
      allTasks[targetIndex] = temp;

      // Re-assign sequential sort_orders to all items and save to DB
      for (let i = 0; i < allTasks.length; i++) {
        await db.from('document_tasks').update({ sort_order: i }).eq('id', allTasks[i].id);
      }

      loadTasks();
    }

    async function updateStatus(id, newStatus) {
      const { error } = await db.from('document_tasks').update({ status: newStatus }).eq('id', id);
      if (error) alert("Error updating: " + error.message);
      else loadTasks();
    }
    
    async function toggleLock(id, currentLockState) {
      const { error } = await db.from('document_tasks').update({ is_locked: !currentLockState }).eq('id', id);
      if (error) alert("Failed to lock/unlock: " + error.message);
      else loadTasks();
    }

    async function deleteTask(id) {
      if (confirm("Are you sure you want to delete this task? This cannot be undone.")) {
        const { error } = await db.from('document_tasks').delete().eq('id', id);
        if (error) alert("Failed to delete: " + error.message);
        else loadTasks();
      }
    }

    function openEditModal(id) {
      const task = allTasks.find(t => t.id === id);
      if (!task || task.is_locked) return;
      
      document.getElementById('edit-id').value = task.id;
      document.getElementById('edit-title').value = task.title;
      document.getElementById('edit-category').value = task.category;
      document.getElementById('edit-assignee').value = task.assignee;
      document.getElementById('edit-phone').value = task.telephone || '';
      document.getElementById('edit-email').value = task.email || '';
      document.getElementById('edit-address').value = task.address || '';
      document.getElementById('edit-notes').value = task.notes || '';
      
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    async function saveEdit() {
      const id = document.getElementById('edit-id').value;
      const updates = {
        title: document.getElementById('edit-title').value,
        category: document.getElementById('edit-category').value,
        assignee: document.getElementById('edit-assignee').value,
        telephone: document.getElementById('edit-phone').value || null,
        email: document.getElementById('edit-email').value || null,
        address: document.getElementById('edit-address').value || null,
        notes: document.getElementById('edit-notes').value || null,
      };

      const { error } = await db.from('document_tasks').update(updates).eq('id', id);
      if (error) {
        alert("Failed to update: " + error.message);
      } else {
        closeEditModal();
        loadTasks();
      }
    }

    async function addDocument() {
      const title = document.getElementById('new-title').value;
      const category = document.getElementById('new-category').value;
      const assignee = document.getElementById('new-assignee').value;
      const phone = document.getElementById('new-phone').value;
      const email = document.getElementById('new-email').value;
      const address = document.getElementById('new-address').value;
      const notes = document.getElementById('new-notes').value;

      if (!title || !assignee) return alert("Please fill out the document name and assignee.");

      const { error } = await db.from('document_tasks').insert({ 
        title: title, 
        category: category, 
        assignee: assignee, 
        telephone: phone || null, 
        email: email || null, 
        address: address || null, 
        notes: notes || null,
        status: 'Pending', 
        sort_order: allTasks.length 
      });

      if (error) {
        alert("Failed to add: " + error.message);
      } else {
        document.getElementById('new-title').value = '';
        document.getElementById('new-assignee').value = '';
        document.getElementById('new-phone').value = '';
        document.getElementById('new-email').value = '';
        document.getElementById('new-address').value = '';
        document.getElementById('new-notes').value = '';
        loadTasks(); 
      }
    }

    checkAuth();
  </script>
</body>
</html>
